name: Telegram Sender

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Create State File If Missing
        run: |
          if [ ! -f sent_state.json ]; then
            echo "{}" > sent_state.json
          fi

      - name: Run Telegram Sender Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: python send_configs.py

      - name: Commit and Push State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent_state.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update sent configs state (auto-bot) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
