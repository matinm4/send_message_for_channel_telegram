# دسترسی نوشتن برای ذخیره فایل وضعیت
permissions:
  contents: write

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install telethon

  - name: Run Telegram Sender Script
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      SESSION_STRING: ${{ secrets.SESSION_STRING }}
    run: python send_configs.py

  - name: Commit and Push State
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add sent_state.json
      if git diff-index --quiet HEAD --; then
        echo "No new configs were found. Nothing to commit."
      else
        git commit -m "chore: update sent configs state (auto-bot) [skip ci]"
        git push
      fi
